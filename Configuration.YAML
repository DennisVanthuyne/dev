# Configuration.yaml file from hassio running on raspberry

# Loads default set of integrations. Do not remove.
default_config:

# Example configuration.yaml entry ble tracker
ble_monitor:
  discovery: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml




# Victron Configuration.  // If you require stats from your victron system you must have a Venus device installed as part of your Victron installation. This does not use VRM.This users MODBUS
modbus:
  - name: victron
    type: tcp
    host: 192.168.1.102
    port: 502
    sensors:
      - name: "Battery Power"
        unit_of_measurement: W
        slave: 100
        address: 842
      - name: "Battery SOC"   # // Best battery state of charge, determined from different measurements. read from //com.victronenergy.system
        unit_of_measurement: "%"
        scale: 1
        precision: 1
        slave: 100
        address: 843
      - name: "Battery Voltage"  # // Battery Voltage determined from different measurements. In order of preference: BMV-voltage (V), Multi-DC-Voltage (CV), MPPT-DC-Voltage (ScV), Charger voltage //com.victronenergy.system
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        slave: 100
        address: 840

      - name: "Battery Current" # // Postive: battery begin charged. Negative: battery being discharged read from //com.victronenergy.system
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        slave: 100
        address: 841

      - name: "Battery Power" # // Postive: battery begin charged. Negative: battery being discharged read from //com.victronenergy.system
        unit_of_measurement: "W"
        scale: 1
        precision: 1
        slave: 100
        address: 842

      - name: "Battery State"
        scale: 1
        precision: 1
        slave: 100
        address: 844

      - name: "Battery Consumed Amphours"
        unit_of_measurement: "Ah"
        scale: -10
        precision: 1
        slave: 100
        address: 845

      - name: "Battery Time to Go"  #\\ Special value: 0 = charging read from //com.victronenergy.system
        unit_of_measurement: "s"
        scale: 0.01
        precision: 1
        slave: 100
        address: 846

      - name: "Eskom Grid"  #\\ Power supplied by Grid to system. read from //com.victronenergy.system
        unit_of_measurement: "W"
        scale: 1
        precision: 1
        slave: 100
        address: 820
        
      - name: "AC Loads"  #\\ Power supplied by Inverter to loads. read from //com.victronenergy.system
        unit_of_measurement: "W"
        scale: 1
        precision: 1
        slave: 100
        address: 817

      - name: "Active input source"  #\\ Power supplied by Grid to system. read from //com.victronenergy.system
        unit_of_measurement: "W"  # \\ 0=Not available;1=Grid;2=Generator;3=Eskom power;240=Not connected
        scale: 1
        precision: 1
        slave: 100
        address: 826

      - name: "Grid lost alarm" # \\ 0=Ok;2=Alarm
        scale: 1
        precision: 1
        slave: 242
        address: 64

      - name: "VE.Bus state" # \\ 0=Off;1=Low Power;2=Fault;3=Bulk;4=Absorption;5=Float;6=Storage;7=Equalize;8=Passthru;9=Inverting;10=Power assist;11=Power supply;252=Bulk protection
        scale: 1
        precision: 1
        slave: 227
        address: 31
        

###############################################################
#                                                             #
#     Sensor Configurations - com.victronenergy.solarcharger  #
#                                                             #
###############################################################
      - name: "Battery temp" # \\ Degrees celsius
        scale: 10
        precision: 1
        slave: 224
        address: 773

      - name: " Solar Charge state" # \\ 0=Off;2=Fault;3=Bulk;4=Absorption;5=Float;6=Storage;7=Equalize;11=Other (Hub-1);252=External control
        scale: 1
        precision: 1
        slave: 224
        address: 775

      - name: " PV voltage" # \\ Not available if multiple VE.Can chargers are combined
        unit_of_measurement: "V"
        scale: 0.01
        slave: 224
        address: 776

      - name: " PV Current" # \\ Not available if multiple VE.Can chargers are combined
        unit_of_measurement: "A"
        scale: 0.01
        precision: 1
        slave: 224
        address: 61

      - name: " PV Power" # \\ Not available if multiple VE.Can chargers are combined
        unit_of_measurement: "W"
        scale: 0.1
        precision: 1
        slave: 224
        address: 789
        
      - name: " Yield today" # \\ Today's yield
        unit_of_measurement: "kWh"
        scale: 10
        precision: 1
        slave: 224
        address: 784

      - name: " Maximum charge power today" # \\ Today's maximum power
        unit_of_measurement: "kWh"
        scale: 1
        precision: 1
        slave: 224
        address: 785

      - name: " Yield Yesterday" # \\ Yesterdays's yield
        unit_of_measurement: "kWh"
        scale: 10
        precision: 1
        slave: 224
        address: 786

      - name: " Maximum charge power yesterday" # \\ Yesterdays's maximum power
        unit_of_measurement: "kWh"
        scale: 1
        precision: 1
        slave: 224
        address: 785
        
        #GPS integration
        
      - name: "GPS Latitude"
        unit_of_measurement: "°"
        scale: 10000000
        slave: 100
        address: 2800
        
        
    
#\\ Maxxfan integration
input_select:
  maxxfan_air_direction:
    name: Air Direction
    options:
      - Air In
      - Air Out
    initial: Air In
    icon: mdi:fan

  maxxfan_lid:
    name: Lid State
    options:
      - Open
      - Closed
    initial: Open
    icon: mdi:window-shutter

input_number:
  maxxfan_speed:
    name: Fan Speed
    min: 10
    max: 100
    step: 10
    unit_of_measurement: '%'
    initial: 50
    icon: mdi:fan-speed-3
    
# Mopeka Water sensors
template:
  - sensor:
      - name: "Clean Water Tank Percentage"
        unit_of_measurement: "%"
        state: >
          {% set tank_level = states('sensor.pro_check_h2o_449b_tank_level') | float(0) %}
          {% set max_volume = 380 %}
          {% if tank_level > 0 and tank_level <= max_volume %}
            {{ (tank_level / max_volume * 100) | round(1) }}
          {% elif tank_level > max_volume %}
            100
          {% else %}
            0
          {% endif %}
        attributes:
          friendly_name: "Clean Water Tank Percentage"
          icon: "mdi:water"
          
      - name: "Grey Water Tank Percentage"
        unit_of_measurement: "%"
        state: >
          {% set tank_level = states('sensor.pro_check_h2o_4093_tank_level') | float(0) %}
          {% set max_volume = 200 %}
          {% if tank_level > 0 and tank_level <= max_volume %}
            {{ (tank_level / max_volume * 100) | round(1) }}
          {% elif tank_level > max_volume %}
            100
          {% else %}
            0
          {% endif %}
        attributes:
          friendly_name: "Grey Water Tank Percentage"
          icon: "mdi:water"



