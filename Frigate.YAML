##############################
##           MQTT           ##
##############################

mqtt:
  host: host ip
  user: mqtt-user
  password: password

##############################
##      GO2RTC - streams    ##
##############################

#https://github.com/AlexxIT/go2rtc#source-ffmpeg-device

go2rtc:
  streams:
    front_cam: ffmpeg:device?video=0&video_size=1280x720#video=h264 #Open RTSP Stream from usb camera, using FFMPEG, compressed in H.264
    test_cam: rtsp://admin:123456@192.168.1.106:554/stream1


##############################
##         CORAL TPU        ##
##############################

detectors:
  coral:
    type: edgetpu
    device: usb

##############################
##        Record mode       ##
##############################

record:
  enabled: true
  retain:
    days: 0
    mode: motion
  events:
    retain:
      default: 2
      mode: motion

##############################
##       Snapshot mode      ##
##############################

snapshots:
  enabled: true
  retain:
    default: 7

##############################
##          Cameras         ##
##############################

cameras:

  front_cam:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_cam
          roles:
            - detect

    objects:
      mask: 0,0,1,0,1,1,0,1
  test_cam:
    ffmpeg:
      inputs:
        - path: rtsp://192.168.1.103:554/stream1
          roles:
            - detect

##############################
##         Detection        ##
##############################

    detect:
      width: 1280
      height: 720
      fps: 5

    motion:
      mask:
        - 0.000,0.427,0.002,0.000,0.999,0.000,0.999,0.781,0.885,0.456,0.700,0.424,0.701,0.311,0.507,0.294,0.453,0.347,0.451,0.400

version: 0.14
